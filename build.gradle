plugins {
  id "java-library"
  alias(libs.plugins.maven.publish)
}

group "io.github.gzsombor"
version "1.1.6"

allprojects {
  group = rootProject.group
  version = rootProject.version

  repositories {
    mavenCentral()
  }
}

subprojects {
  plugins.withType(JavaPlugin).configureEach {
    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(11)
      }
    }

    tasks.withType(Test).configureEach {
      useJUnitPlatform()
      testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
      }
    }
  }
}

dependencies {
  api project(":json-logic-core")
  runtimeOnly project(":json-logic-java-compiler-javac")
  runtimeOnly project(":json-logic-jep484")
}

sourceSets {
  jmh {
    java.srcDirs = ['src/jmh/java']
    compileClasspath += sourceSets.main.output + configurations.jmhCompileClasspath
    runtimeClasspath += sourceSets.main.output + configurations.jmhRuntimeClasspath
  }
}

configurations {
  jmhImplementation
  jmhAnnotationProcessor
  jmhCompileClasspath.extendsFrom jmhImplementation
  jmhRuntimeClasspath.extendsFrom jmhImplementation
}

dependencies {
  jmhImplementation project(":")
  jmhImplementation project(":json-logic-jep484")
  jmhImplementation libs.jmh.core
  jmhAnnotationProcessor libs.jmh.generator.annprocess
}

compileJmhJava.javaCompiler = javaToolchains.compilerFor {
  languageVersion = JavaLanguageVersion.of(24)
}
compileJmhJava.options.annotationProcessorPath = configurations.jmhAnnotationProcessor

tasks.register('jmh', JavaExec) {
  dependsOn compileJmhJava
  group = 'benchmark'
  description = 'Run JMH benchmarks (org.openjdk.jmh.Main)'
  mainClass = 'org.openjdk.jmh.Main'
  classpath = sourceSets.jmh.runtimeClasspath
  doFirst {
    if (project.hasProperty('jmhArgs')) {
      def parts = project.property('jmhArgs').toString().split('\\s+') as List
      setArgs(parts)
    }
  }
}

mavenPublishing {
  publishToMavenCentral()
  // Only sign when a key is provided (releases), so publishToMavenLocal works without GPG setup
  if (providers.gradleProperty("signingInMemoryKey").isPresent() || providers.gradleProperty("signing.keyId").isPresent()) {
    signAllPublications()
  }

  pom {
    name = "json-logic-java"
    description = "A native Java implementation of the json-logic project"
    url = "https://github.com/gzsombor/json-logic-java"

    licenses {
      license {
        name = "MIT License"
        url = "https://github.com/gzsombor/json-logic-java/blob/master/LICENSE"
      }
    }

    developers {
      developer {
        id = "jamsesso"
        name = "Sam Jesso"
        url = "https://github.com/jamsesso/"
      }
      developer {
        id = "gzsombor"
        name = "Zsombor Gegesy"
        url = "https://github.com/gzsombor/"
      }
    }

    scm {
      url = "https://github.com/gzsombor/json-logic-java/"
      connection = "scm:git:git://github.com/gzsombor/json-logic-java.git"
      developerConnection = "scm:git:ssh://git@github.com/gzsombor/json-logic-java.git"
    }
  }
}
