name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0). Defaults to stripping -SNAPSHOT from current.'
        required: false
        type: string
      next_version:
        description: 'Next development version (e.g. 1.3.0-SNAPSHOT). Defaults to auto-incremented patch.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Determine release and next development versions
        id: versions
        run: |
          CURRENT=$(grep '^version ' build.gradle | sed 's/version "\(.*\)"/\1/')

          if [ -z "${{ inputs.version }}" ] && [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "Current version ($CURRENT) is not a -SNAPSHOT; please provide inputs.version" >&2
            exit 1
          fi

          if [ -n "${{ inputs.version }}" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
          else
            RELEASE_VERSION="${CURRENT%-SNAPSHOT}"
          fi

          if [ -n "${{ inputs.next_version }}" ]; then
            NEXT_VERSION="${{ inputs.next_version }}"
          else
            IFS='.' read -ra PARTS <<< "$RELEASE_VERSION"
            NEXT_PATCH=$(( PARTS[2] + 1 ))
            NEXT_VERSION="${PARTS[0]}.${PARTS[1]}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "next_version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "Releasing $RELEASE_VERSION, next will be $NEXT_VERSION"

      - name: Set release version in build.gradle and README
        run: |
          sed -i 's/^version ".*"/version "${{ steps.versions.outputs.release_version }}"/' build.gradle
          sed -i 's|<version>[0-9]*\.[0-9]*\.[0-9]*</version>|<version>${{ steps.versions.outputs.release_version }}</version>|' README.md

      - name: Build and test
        run: ./gradlew build

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle README.md
          git commit -m "Release ${{ steps.versions.outputs.release_version }}"
      - name: Create and push release tag
        run: |
          git tag -a "${{ steps.versions.outputs.release_version }}" \
            -m "Release ${{ steps.versions.outputs.release_version }}"
          git push origin "${{ steps.versions.outputs.release_version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.versions.outputs.release_version }}" \
            --title "${{ steps.versions.outputs.release_version }}" \
            --generate-notes

      - name: Bump to next development version
        run: |
          sed -i 's/^version ".*"/version "${{ steps.versions.outputs.next_version }}"/' build.gradle
          git add build.gradle
          git commit -m "Prepare ${{ steps.versions.outputs.next_version }} for development [skip ci]"

      - name: Push commits to default branch
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
